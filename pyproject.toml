[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "no1"
version = "0.4.22"
description = "Global multi-agent delivery kernel with working groups, scopes, and an append-only collaboration ledger"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
authors = [
  { name = "ChesterRa", email = "ra@ike.ba" }
]
license = "Apache-2.0"
keywords = ["orchestrator","ai","rfd","pair","collaboration"]
dependencies = [
  "cryptography>=41.0.0,<47.0",
  "PyYAML>=6.0,<7.0",
  "dingtalk-stream>=0.24.3",
  "fastapi>=0.110,<1.0",
  "filelock>=3.13,<4",
  "httpx[socks]>=0.24,<1.0",
  "lark-oapi>=1.0.0",
  "pydantic>=2.0,<3.0",
  "pywinpty>=2.0,<3.0.4; platform_system == 'Windows'",
  "comtypes>=1.4; platform_system == 'Windows'",
  "python-multipart>=0.0.7,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "wechatbot-sdk>=0.2.0",
  "websocket-client>=1.8,<2.0",
  "tzdata>=2026.2",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/ChesterRa/onecolleague"
Repository = "https://github.com/ChesterRa/onecolleague"
Issues = "https://github.com/ChesterRa/onecolleague/issues"

[project.scripts]
onecolleague = "no1.cli:main"
onecolleagued = "no1.daemon_main:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"no1.ports.web" = ["dist/**"]
"no1.resources" = ["*.md", "*.yaml", "*.json", "*.py", "im/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["no1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "packaged_web_dist: requires the Web build artifact consumed by package CI",
]

[tool.ruff]
target-version = "py311"
exclude = [
  "src/no1/providers/notebooklm/_vendor",
  "src/no1/vendor",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[dependency-groups]
dev = [
    "nuitka>=4.1.2",
    "ordered-set>=4.1.0",
    "zstandard>=0.25.0",
]
