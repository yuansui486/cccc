name: Nuitka Standalone Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Build macOS standalone package
        run: |
          bash scripts/build_nuitka_standalone.sh --install-deps

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: onecolleague-nuitka-macos-arm64
          path: dist/onecolleague-*-macos-arm64.zip
          if-no-files-found: error
